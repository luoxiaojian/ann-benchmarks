# Zvec Optimized config — data-driven minimal set covering the full Recall-QPS Pareto frontier.
# Based on full-sift benchmark results: only Pareto-dominant build configs retained,
# with 4 query-param variants per ef level for robustness (≥3 groups per recall band).
# 3 builds × 28 query combos = 84 total runs per constructor (95% reduction vs full).
float:
  any:
  - base_args: ['@metric', '@dimension']
    constructor: ZvecQuery
    disabled: false
    docker_tag: ann-benchmarks-zvec
    module: ann_benchmarks.algorithms.zvec
    name: zvec-query
    run_groups: &zvec_run_groups
      Vamana-D64-L300-a15:
        args:
          index: vamana
          max_degree: 64
          search_list_size: 300
          alpha: 1.5
          quantize: uniform_int8
        query_arg_groups:
          - ef: [10, 16, 20, 28, 40, 64, 128]
            prefetch_offset: [48, 64]
            prefetch_lines: [0, 2]
      Vamana-D64-L500-a15:
        args:
          index: vamana
          max_degree: 64
          search_list_size: 500
          alpha: 1.5
          quantize: uniform_int8
        query_arg_groups:
          - ef: [10, 16, 20, 28, 40, 64, 128]
            prefetch_offset: [48, 64]
            prefetch_lines: [0, 2]
      Vamana-D64-L500-a13:
        args:
          index: vamana
          max_degree: 64
          search_list_size: 500
          alpha: 1.3
          quantize: uniform_int8
        query_arg_groups:
          - ef: [10, 16, 20, 28, 40, 64, 128]
            prefetch_offset: [48, 64]
            prefetch_lines: [0, 2]
  - base_args: ['@metric', '@dimension']
    constructor: ZvecFastQuery
    disabled: true
    docker_tag: ann-benchmarks-zvec
    module: ann_benchmarks.algorithms.zvec
    name: zvec-fast_query
    run_groups: *zvec_run_groups
  - base_args: ['@metric', '@dimension']
    constructor: ZvecFastQueryDocIds
    disabled: false
    docker_tag: ann-benchmarks-zvec
    module: ann_benchmarks.algorithms.zvec
    name: zvec-fast_query_doc_ids
    run_groups: *zvec_run_groups
  - base_args: ['@metric', '@dimension']
    constructor: ZvecAnnBenchDocIds
    disabled: false
    docker_tag: ann-benchmarks-zvec
    module: ann_benchmarks.algorithms.zvec
    name: zvec-ann_bench_doc_ids
    run_groups: *zvec_run_groups
