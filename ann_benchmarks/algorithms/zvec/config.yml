# Compare prepared query and query_internal_ids on the same parameter grid.
# Uniform groups target SIFT; Record groups target GIST.
# UniformInt8 uses UINT7. scale_factor=1.0 disables refinement.
float:
  euclidean:
  - base_args: ['@metric', '@dimension']
    constructor: ZvecQuery
    disabled: false
    docker_tag: ann-benchmarks-zvec
    module: ann_benchmarks.algorithms.zvec
    name: zvec-query
    run_groups: &zvec_run_groups
      UniformInt8:
        args:
          max_degree: [10, 22, 36, 48]
          search_list_size: [300, 500]
          alpha: [1.5]
          quantize: uniform_uint7
        query_args: [[10, 11, 12, 13, 15, 17]]
      UniformUint4Refine:
        args:
          max_degree: [48, 52, 64]
          search_list_size: [300, 400]
          alpha: [1.5]
          use_flat_contiguous_memory: true
          flat_data_type: uint8
          quantize: uniform_uint4
        query_args:
          - [
              {ef_search: 17, scale_factor: 1.5},
              {ef_search: 17, scale_factor: 1.7},
              {ef_search: 20, scale_factor: 1.8},
              {ef_search: 22, scale_factor: 1.9},
              {ef_search: 24, scale_factor: 2.0},
              {ef_search: 24, scale_factor: 2.4},
              {ef_search: 26, scale_factor: 2.2},
              {ef_search: 26, scale_factor: 2.6},
              {ef_search: 30, scale_factor: 2.5},
              {ef_search: 34, scale_factor: 2.8},
              {ef_search: 38, scale_factor: 3.2},
              {ef_search: 45, scale_factor: 3.8},
              {ef_search: 45, scale_factor: 4.0},
              {ef_search: 52, scale_factor: 4.4},
              {ef_search: 64, scale_factor: 5.4},
              {ef_search: 80, scale_factor: 6.8},
              {ef_search: 104, scale_factor: 8.8},
              {ef_search: 136, scale_factor: 9.8}
            ]
      RecordInt8LowDegree:
        args:
          max_degree: [32, 48]
          search_list_size: [300]
          alpha: [1.3]
          use_flat_contiguous_memory: true
          flat_data_type: fp16
        query_args:
          - [
              24, 27, 28, 31, 32, 36, 40, 43, 48, 56, 64, 72, 80, 88, 96, 104, 112, 128, 144, 160, 192,
              {ef_search: 80, scale_factor: 1.1},
              {ef_search: 80, scale_factor: 1.2},
              {ef_search: 80, scale_factor: 1.4},
              {ef_search: 88, scale_factor: 1.1},
              {ef_search: 88, scale_factor: 1.2},
              {ef_search: 88, scale_factor: 1.4},
              {ef_search: 96, scale_factor: 1.1},
              {ef_search: 96, scale_factor: 1.2},
              {ef_search: 96, scale_factor: 1.4},
              {ef_search: 104, scale_factor: 1.1},
