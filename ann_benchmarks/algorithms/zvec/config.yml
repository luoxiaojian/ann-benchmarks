# Auto-prefetch counterpart of config-sift-gist-pareto-compact.yml.
# All index-build and non-prefetch query parameters are unchanged.
# Vamana prefetch fields are intentionally omitted so zvec resolves
# them from max_degree and the stored-vector schema at query setup.
# Scalar ef-only queries use compact flow lists. Multi-field queries retain
# one mapping per line inside the required outer query_args argument group.
float:
  euclidean:
    - base_args: ['@metric', '@dimension']
      constructor: ZvecAnnBenchDocIds
      disabled: false
      docker_tag: ann-benchmarks-zvec
      module: ann_benchmarks.algorithms.zvec
      name: zvec-ann_bench_doc_ids
      run_groups: &zvec_auto_prefetch_run_groups
        UniformInt8:
          args:
            index: vamana
            max_degree: [10, 22, 36, 48]
            search_list_size: [300, 500]
            alpha: [1.5]
            use_bulk_build: false
            quantize: uniform_int8
          query_args:
            - [10, 11, 12, 13, 15, 17]
        UniformUint4Refine:
          args:
            index: vamana
            max_degree: [48, 52, 64]
            search_list_size: [300, 400]
            alpha: [1.5]
            use_bulk_build: false
            use_flat_contiguous_memory: true
            flat_data_type: uint8
            quantize: uniform_uint4
          query_args:
            - [
                {ef: 17, candidate_topk: 15, refine: true},
                {ef: 17, candidate_topk: 17, refine: true},
                {ef: 20, candidate_topk: 18, refine: true},
                {ef: 22, candidate_topk: 19, refine: true},
