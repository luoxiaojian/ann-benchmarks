# Zvec Full config — comprehensive build configs & dense query sweeps for detailed Pareto frontier.
# ~300+ query combos per constructor, for thorough benchmarking.
float:
  any:
  - base_args: ['@metric', '@dimension']
    constructor: ZvecQuery
    disabled: false
    docker_tag: ann-benchmarks-zvec
    module: ann_benchmarks.algorithms.zvec
    name: zvec-query
    run_groups: &zvec_run_groups
      HNSW-M24-efc300:
        args:
          index: hnsw
          M: 24
          efConstruction: 300
          quantize: [int8, uniform_int8]
        query_arg_groups:
          - ef: [24, 40, 64, 96, 128, 192, 256, 384, 512, 768, 1024]
            prefetch_offset: [40, 48]
            prefetch_lines: [0, 2]
      HNSW-M32-efc500:
        args:
          index: hnsw
          M: 32
          efConstruction: 500
          quantize: [int8, uniform_int8]
        query_arg_groups:
          - ef: [32, 48, 64, 96, 128, 192, 256, 384, 512, 768, 1024]
            prefetch_offset: [48, 64]
            prefetch_lines: [0, 2]
      Vamana-D32-L500-a13:
        args:
          index: vamana
          max_degree: 32
          search_list_size: 500
          alpha: 1.3
          quantize: int8
        query_arg_groups:
          - ef: [32, 48, 64, 80, 96, 112, 128, 160, 192, 256]
            prefetch_offset: [32]
            prefetch_lines: [2, 3]
      Vamana-D32-L500-a15:
        args:
          index: vamana
          max_degree: 32
          search_list_size: 500
          alpha: 1.5
          quantize: int8
        query_arg_groups:
          - ef: [48, 64, 80, 96, 112, 128, 160, 192, 256]
            prefetch_offset: [24, 32]
            prefetch_lines: [2, 3]
      Vamana-D48-L100-a15:
        args:
          index: vamana
          max_degree: 48
          search_list_size: 100
          alpha: 1.5
          quantize: int8
        query_arg_groups:
          - ef: [10, 12, 16, 20, 24, 28, 32, 40, 48, 64]
            prefetch_offset: [48]
            prefetch_lines: [0, 2, 3]
      Vamana-D48-L300-a15:
        args:
          index: vamana
          max_degree: 48
          search_list_size: 300
          alpha: 1.5
          quantize: int8
        query_arg_groups:
          - ef: [12, 16, 20, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512]
            prefetch_offset: [48]
            prefetch_lines: [2, 3]
      Vamana-D48-L500-a13:
        args:
          index: vamana
          max_degree: 48
          search_list_size: 500
          alpha: 1.3
          quantize: int8
        query_arg_groups:
          - ef: [48, 64, 80, 96, 112, 128, 160, 192, 256, 384, 512]
            prefetch_offset: [40, 48]
            prefetch_lines: [2, 3]
      Vamana-D48-L500-a15:
        args:
          index: vamana
          max_degree: 48
          search_list_size: 500
          alpha: 1.5
          quantize: int8
        query_arg_groups:
          - ef: [16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512]
            prefetch_offset: [48]
            prefetch_lines: [2, 3]
      Vamana-D64-L300-a13:
        args:
          index: vamana
          max_degree: 64
          search_list_size: 300
          alpha: 1.3
          quantize: int8
        query_arg_groups:
          - ef: [24, 32, 48, 64, 96, 128, 192, 256, 384, 512]
            prefetch_offset: [48, 64]
            prefetch_lines: [2, 3]
      Vamana-D64-L300-a15:
        args:
          index: vamana
          max_degree: 64
          search_list_size: 300
          alpha: 1.5
          quantize: int8
        query_arg_groups:
          - ef: [10, 12, 16, 20, 24, 28, 32, 40, 48, 64, 96, 128, 192, 256, 384, 512]
            prefetch_offset: [48, 64]
            prefetch_lines: [0, 2, 3]
      Vamana-D64-L500-a13:
        args:
          index: vamana
          max_degree: 64
          search_list_size: 500
          alpha: 1.3
          quantize: int8
        query_arg_groups:
          - ef: [24, 32, 40, 48, 64, 80, 96, 112, 128, 160, 192, 256, 384, 512]
            prefetch_offset: [48, 64]
            prefetch_lines: [2, 3]
      Vamana-D64-L500-a15:
        args:
          index: vamana
          max_degree: 64
          search_list_size: 500
          alpha: 1.5
          quantize: int8
        query_arg_groups:
          - ef: [12, 16, 20, 24, 28, 32, 40, 48, 64, 96, 128, 160, 192, 256, 384, 512]
            prefetch_offset: [48, 64]
            prefetch_lines: [0, 2, 3]
  - base_args: ['@metric', '@dimension']
    constructor: ZvecFastQuery
    disabled: true
    docker_tag: ann-benchmarks-zvec
    module: ann_benchmarks.algorithms.zvec
    name: zvec-fast_query
    run_groups: *zvec_run_groups
  - base_args: ['@metric', '@dimension']
    constructor: ZvecFastQueryDocIds
    disabled: false
    docker_tag: ann-benchmarks-zvec
    module: ann_benchmarks.algorithms.zvec
    name: zvec-fast_query_doc_ids
    run_groups: *zvec_run_groups
  - base_args: ['@metric', '@dimension']
    constructor: ZvecAnnBenchDocIds
    disabled: false
    docker_tag: ann-benchmarks-zvec
    module: ann_benchmarks.algorithms.zvec
    name: zvec-ann_bench_doc_ids
    run_groups: *zvec_run_groups
